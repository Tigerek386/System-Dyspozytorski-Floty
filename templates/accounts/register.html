{% extends "base.html" %}
{% block title %}Register - FleetRoute{% endblock %}
{% block content %}
<div class="card">
    <h1>Register</h1>
    <p>Create an account as a <strong>dispatcher</strong>, a <strong>fleet manager</strong>
    or a <strong>driver</strong>.</p>
    <form method="post" style="max-width: 420px;">
        {% csrf_token %}
        {% for field in form %}
            <label>
                {{ field.label }}
                {{ field }}
                {% if field.errors %}
                    <span class="field-errors">{{ field.errors|join:", " }}</span>
                {% endif %}
            </label>
        {% endfor %}
        <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</div>
{% endblock %}
